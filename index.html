<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora Alejandra Morales</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            text-align: center;
            background-color: #f4f4f4; /* Fondo ligero para contraste */
        }
        header {
            padding: 20px;
            background-color: rgb(14, 1, 10);
        }
        main {
            flex: 1;
            padding: 20px;
            max-width: 900px; /* Reducido para que sea más compacto */
            margin: 0 auto;
        }
        
        /* Estilo para las secciones de cada semana */
        .semana {
            background: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .contenido-flex {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        /* Imágenes y videos más pequeños */
        .imagen-semana, video {
            max-width: 300px; 
            height: auto;
            border-radius: 8px;
        }

        /* PDF más pequeño pero funcional */
        .pdf-container {
            max-width: 600px;
            margin: 0 auto;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            border-top: 1px solid rgb(21, 2, 10);
            background-color: rgb(242, 239, 146);
        }

        h1 {
            color: #fff;
            font-size: 2.5rem; /* Un poco más pequeño */
            text-transform: uppercase;
            text-shadow: 0 0 7px #fff, 0 0 10px #fff, 0 0 21px #00d2ff, 0 0 42px #00d2ff;
        }

        .logo { transition: 0.3s; }
        .logo:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <header>
        <h1>Bitácora Segunda y Tercera Unidad</h1>
    </header>

    <main>
        <h3>Contenido de la página WEB</h3>

        <!-- SEMANA 1 -->
        <div class="semana">
                    <h4>Semana 1: Introducción a Arduino</h4>
                    <p>Aprendimos sobre la plataforma, componentes y señales.</p>
            <div class="pdf-container">
                <embed src="Introducción Arduino (1).pdf" type="application/pdf" width="100%" height="300px" />
            </div>
            <p>
                <a href="Introducción Arduino (1).pdf" target="_blank" style="color: #3f64f7; text-decoration: none; font-weight: bold; font-size: 0.9rem;">
                    📂 Abrir PDF completo
                </a>
            </p>
        </div>

        <!-- SEMANA 2 -->
        <div class="semana">
            <h4>Semana 2: Introducción a CSS</h4>
            <p>Aprendimos a dar estilo a las páginas mediante selectores y diseño visual.</p>
            
            <div class="contenido-flex">
                <!-- Asegúrate que Imagen.jpg exista en tu carpeta -->
                <img   class="imagen-semana">
                
                <video controls>
                    <source src="Grabación Alejandra Morales.mp4" type="video/mp4">
                    Tu navegador no soporta el video.
                </video>
            </div>
        </div>
    </main> 

    <footer>
        <span>@alejandraaortega</span>
        <img src="https://www.capouilliez.edu.gt/assets/img/logo.png" height="25" width="100" class="logo">
    </footer>

</body>
</html>
